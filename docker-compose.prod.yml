services:
  nginx:
    volumes:
      - letsencrypt:/etc/letsencrypt
      - certbot_webroot:/var/www/certbot

  certbot:
    image: certbot/certbot:latest
    container_name: facturarg_certbot
    volumes:
      - letsencrypt:/etc/letsencrypt
      - certbot_webroot:/var/www/certbot
    entrypoint: /bin/sh
    # Do not force --webroot here: wildcard/DNS-01 lineages need their own authenticator from /etc/letsencrypt/renewal/*.conf
    command: -c "trap exit TERM; while :; do sleep 12h & wait $${!}; certbot renew --quiet; done"

  # Wildcard HTTPS for multitenant subdomains (*.example.com):
  # 1) Issue once with DNS-01 (HTTP-01 cannot get *.domain). Example GoDaddy API token at /root/.secrets/certbot:
  #    docker compose -f docker-compose.yml -f docker-compose.prod.yml run --rm certbot_godaddy certbot certonly \
  #      --dns-go-daddy-credentials /secrets/go-daddy.ini \
  #      --dns-go-daddy-propagation-seconds 60 \
  #      --cert-name facturarg.com -d facturarg.com -d '*.facturarg.com' \
  #      --agree-tos --non-interactive --email YOUR_EMAIL
  # 2) Rebuild/recreate nginx so app.prod.conf listens on *.facturarg.com (already in docker/nginx/templates).
  # 3) Renewal: configure the same dns plugin hooks (renew uses auth hooks from issuance) or automate certbot_dns_plugin renew.

  certbot_godaddy:
    image: miigotu/certbot-dns-godaddy:latest
    container_name: facturarg_certbot_godaddy
    volumes:
      - letsencrypt:/etc/letsencrypt
      - /root/.secrets/certbot:/secrets:ro
    entrypoint: /usr/bin/env

volumes:
  letsencrypt:
  certbot_webroot:
