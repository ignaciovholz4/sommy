services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: facturarg_app
    working_dir: /var/www/html
    restart: unless-stopped
    environment:
      # Production defaults — always set; .env values are secondary
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: https://facturarg.com
      SESSION_DRIVER: redis
      SESSION_CONNECTION: sessions
      SESSION_SECURE_COOKIE: "true"

      # Database
      DB_CONNECTION: landlord
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: facturag
      DB_USERNAME: root
      DB_PASSWORD: ${DB_PASSWORD:-root}
      DB_ADMIN_USER: root
      DB_ADMIN_PASSWORD: ${DB_ADMIN_PASSWORD:-root}
      TENANT_DB_USERNAME: root
      TENANT_DB_PASSWORD: ${TENANT_DB_PASSWORD:-root}
    volumes:
      - ./:/var/www/html
    depends_on:
      - db
      - redis
      - mailpit

  nginx:
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile
    container_name: facturarg_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./:/var/www/html:ro
      - nginx_ssl:/etc/nginx/ssl
    depends_on:
      - app

  db:
    image: mysql:8.0
    container_name: facturarg_db
    restart: unless-stopped
    command:
      - mysqld
      - --default-authentication-plugin=mysql_native_password
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --log_bin_trust_function_creators=1
    environment:
      MYSQL_DATABASE: facturag
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root}
      MYSQL_USER: root
      MYSQL_PASSWORD: ${DB_PASSWORD:-root}
    ports:
      - "3306:3306"
    volumes:
      - dbdata:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p${DB_PASSWORD:-root} || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: facturarg_redis
    restart: unless-stopped
    ports:
      - "6379:6379"

  mailpit:
    image: axllent/mailpit:latest
    container_name: facturarg_mailpit
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  dbdata:
  nginx_ssl:
