upstream php_upstream {
  server app:9000;
}

# Allows HTTP-01 challenge for future single-host certs; wildcard issuance still needs DNS-01.
server {
  listen 80;
  server_name facturarg.com www.facturarg.com *.facturarg.com;

  # Let's Encrypt HTTP-01 challenge
  location ^~ /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  # Temporary: serve the site over HTTP until cert exists
  location / {
    try_files $uri $uri/ /index.php?$query_string;
  }

  location ~ \.php$ {
    try_files $uri =404;
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    fastcgi_param HTTP_X_FORWARDED_PROTO $scheme;
    fastcgi_param HTTP_X_FORWARDED_FOR $remote_addr;
    fastcgi_pass php_upstream;
    fastcgi_read_timeout 300;
  }

  root /var/www/html/public;
  index index.php index.html;
}

# Optional HTTPS during bootstrap (self-signed).
# This prevents port 443 from hanging while we haven't obtained a real cert yet.
server {
  listen 443 ssl http2;
  server_name facturarg.com www.facturarg.com *.facturarg.com;

  ssl_certificate     /etc/nginx/ssl/fullchain.pem;
  ssl_certificate_key /etc/nginx/ssl/privkey.pem;

  client_max_body_size 64M;

  root /var/www/html/public;
  index index.php index.html;

  location / {
    try_files $uri $uri/ /index.php?$query_string;
  }

  location ~ \.php$ {
    try_files $uri =404;
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    fastcgi_param HTTP_X_FORWARDED_PROTO $scheme;
    fastcgi_param HTTP_X_FORWARDED_FOR $remote_addr;
    fastcgi_param HTTPS on;
    fastcgi_pass php_upstream;
    fastcgi_read_timeout 300;
  }
}
