upstream php_upstream {
  server app:9000;
}

server {
  listen 80;
  server_name _;

  # Let's Encrypt HTTP-01 challenge
  location ^~ /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  listen 443 ssl http2;
  server_name _;

  # In production (docker-compose.prod.yml), certs come from /etc/letsencrypt.
  # For local dev, our entrypoint still generates /etc/nginx/ssl/*.pem
  ssl_certificate     /etc/letsencrypt/live/facturarg.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/facturarg.com/privkey.pem;
  ssl_trusted_certificate /etc/letsencrypt/live/facturarg.com/chain.pem;

  # Reasonable defaults for local SSL
  ssl_session_timeout 1d;
  ssl_session_cache shared:SSL:10m;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers off;

  client_max_body_size 64M;

  root /var/www/html/public;
  index index.php index.html;

  location / {
    try_files $uri $uri/ /index.php?$query_string;
  }

  location ~ \.php$ {
    try_files $uri =404;
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    fastcgi_param HTTP_X_FORWARDED_PROTO $scheme;
    fastcgi_param HTTP_X_FORWARDED_FOR $remote_addr;
    fastcgi_param HTTPS on;
    fastcgi_pass php_upstream;
    fastcgi_read_timeout 300;
  }

  location ~* \.(?:css|js|jpg|jpeg|gif|png|svg|ico|webp|ttf|woff|woff2)$ {
    expires 30d;
    access_log off;
    try_files $uri =404;
  }
}
